name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable release tag to build and publish (e.g. v1.3.0)"
        required: true
        type: string

# Manual dispatch must bind to the tag input; tag pushes use github.ref_name.
# Without this, workflow_dispatch on main leaves the ref as the branch name and
# fails the version/tag asserts (and would create a bogus release title).
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Dispatch must check out the tag tip, not the branch that was selected
          # in the Actions UI (usually main).
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d+\.\d+\.\d+(rc\d+)?", tag) is None:
              raise SystemExit(f"tag {tag!r} is not a vX.Y.Z release tag")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package v{version}")
          PY
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Generate SHA256SUMS
        run: |
          cd dist
          shasum -a 256 -- * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Extract curated release notes from docs/releases
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          path = Path("docs/releases") / f"{version}.md"
          if not path.is_file():
              raise SystemExit(f"missing curated release notes: {path}")
          text = path.read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit(f"curated release notes are empty: {path}")
          Path("release-notes.md").write_text(text + "\n", encoding="utf-8")
          PY
      - name: Upload artifacts to the GitHub Release
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --verify-tag \
              --title "${RELEASE_TAG}" --notes-file release-notes.md
          gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Hand dists to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 1
      - name: Note PyPI publish gate
        run: |
          if [ "${{ vars.ENABLE_PYPI_PUBLISH }}" = "true" ]; then
            echo "ENABLE_PYPI_PUBLISH=true — pypi job will run Trusted Publishing."
          else
            echo "ENABLE_PYPI_PUBLISH is not true — pypi job skipped."
            echo "GitHub Release assets are still published by this dist job."
            echo "After registering a Trusted Publisher on pypi.org for"
            echo "defai-digital/axquant workflow release.yml, set the repository"
            echo "variable ENABLE_PYPI_PUBLISH=true and re-run Release."
            echo "See docs/ci-root-causes.md."
          fi

  # OIDC Trusted Publishing requires a matching publisher on pypi.org / test.pypi.org.
  # Without that operator config, the exchange fails with invalid-publisher and reds
  # every tag push even though GitHub Release assets already succeeded. Gate the job
  # on repository variable ENABLE_PYPI_PUBLISH so Releases stay green until configured.
  #
  # Distribution map (do not conflate these):
  #   PyPI              → pip install axquant          (this job)
  #   GitHub Release    → wheel/sdist assets           (dist job)
  #   GitHub Packages   → npm/container/Maven UIs only (intentionally unused for pip)
  pypi:
    needs: dist
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deployments API only (post-publish status record). Do NOT set job-level
      # `environment:` here — Trusted Publishing OIDC is registered with an
      # empty environment claim.
      deployments: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Drop non-package files
        run: rm -f dist/SHA256SUMS.txt
      # Prerelease tags (vX.Y.ZrcN) go to TestPyPI; final tags go to PyPI.
      - name: Publish to TestPyPI (prerelease)
        if: contains(env.RELEASE_TAG, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ !contains(env.RELEASE_TAG, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
      # Best-effort Deployments UI record. Must never red a successful upload
      # (re-runs then hit "file already exists" on PyPI).
      - name: Record PyPI deployment
        if: ${{ success() && !contains(env.RELEASE_TAG, 'rc') }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const version = process.env.RELEASE_TAG.replace(/^v/, "");
            const releaseUrl = `https://pypi.org/project/axquant/${version}/`;
            const logUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // environment name is for the Deployments UI only; this job has no
            // job-level `environment:` so OIDC still has an empty environment claim.
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.RELEASE_TAG,
              task: "deploy",
              auto_merge: false,
              required_contexts: [],
              environment: "pypi",
              production_environment: true,
              description: `Published axquant ${version} to PyPI`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "success",
              environment_url: releaseUrl,
              log_url: logUrl,
              description: `Published axquant ${version} to PyPI`,
            });
      - name: Distribution summary
        if: success()
        run: |
          {
            echo "### Distribution channels"
            echo ""
            echo "| Channel | URL |"
            echo "|---------|-----|"
            echo "| **PyPI (canonical \`pip install\`)** | https://pypi.org/project/axquant/ |"
            echo "| **GitHub Release assets** | https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG} |"
            echo "| GitHub Packages tab | unused for Python — install from PyPI |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trusted publisher guidance
        if: failure()
        run: |
          cat <<'EOF'
          PyPI Trusted Publishing failed (invalid-publisher is usually missing config).
          Register a Trusted Publisher on pypi.org / test.pypi.org for:
            owner=defai-digital  repo=axquant  workflow=release.yml
          Environment: leave empty (this job does not set job-level environment:).
          The optional "Record PyPI deployment" step uses the Deployments API with
          environment name "pypi" for the UI only — that is not a job environment
          claim and must not be added to the Trusted Publisher config.
          Then keep ENABLE_PYPI_PUBLISH=true. Details: docs/ci-root-causes.md
          EOF
