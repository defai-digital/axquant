# AXQ-MXFP4 4-bit lane for Qwen3.8-27B with integrated MTP.
# Trunk attention+MLP → native MXFP4 (group 32). MTP/vision/norms stay BF16.
# Convert from the full BF16 source (do not use the no-MTP view).
#   axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v1
profile: agent-coding
# Planner still uses affine storage_bpw for gs32 4-bit; MTP BF16 adds headroom.
target_bpw: 5.8
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 8
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms non-quantizable / protected
  - rule_id: mtp-bf16
    roles: [mtp_projection, mtp_block, mtp_output]
    bits: 16
    method: bf16
    reason: Integrated MTP stays BF16; Tier 2 is a separate claim
  - rule_id: lm-head-8
    roles: [lm_head]
    bits: 8
    method: affine
    group_size: 64
    reason: AXQ-026 lm_head 8-bit affine floor
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: affine
    group_size: 32
    reason: AXQ-MXFP4 attention trunk
  - rule_id: mlp-mxfp4
    roles: [mlp]
    bits: 4
    method: affine
    group_size: 32
    reason: AXQ-MXFP4 MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
