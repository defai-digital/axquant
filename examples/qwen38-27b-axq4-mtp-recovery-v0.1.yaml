schema_version: axquant.manual-recipe.v1
profile: agent-coding
target_bpw: 5.5
default_bits: 4
default_method: affine
group_size: 64
allow_unmatched_rules: false
lm_head_min_bits: 8
target_mode: balanced
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms non-quantizable / protected
  - rule_id: mtp-bf16
    roles: [mtp_projection, mtp_block, mtp_output]
    bits: 16
    method: bf16
    reason: MTP stays BF16; Tier 2 not claimed
  - rule_id: lm-head-8
    roles: [lm_head]
    bits: 8
    method: affine
    group_size: 64
    reason: AXQ-026 lm_head 8-bit floor to meet size vs uniform-4
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit
  - rule_id: attention-4
    roles: [attention]
    bits: 4
    method: affine
    group_size: 64
    reason: 4-bit attention product trunk
  - rule_id: mlp-4
    roles: [mlp]
    bits: 4
    method: affine
    group_size: 64
    reason: 4-bit MLP product trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
