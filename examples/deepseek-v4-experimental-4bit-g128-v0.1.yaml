# Flash-0731 4-bit trunk, group 128 — smaller than group-32 so 192 GB can generate.
# Development only. Not mlx-optiq.
schema_version: axquant.manual-recipe.v1
profile: general
target_bpw: 16.0
default_bits: 4
default_method: affine
group_size: 128
allow_unmatched_rules: true
lm_head_min_bits: 16
target_mode: quality
primary_runtime: ax-engine
random_seed: 0
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16 under protection floors
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM head stays BF16 by default
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 128
    reason: Embedding floor remains 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 128
    reason: Router floor remains 8-bit when routers are present
  - rule_id: protect-attention
    roles: [attention]
    bits: 4
    method: affine
    group_size: 128
    reason: Attention trunk stays 4-bit at group 128
  - rule_id: trunk-4bit
    roles: [mlp, expert]
    bits: 4
    method: affine
    group_size: 128
    reason: Robust trunk 4-bit affine, group 128 to fit 192 GB generate
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
