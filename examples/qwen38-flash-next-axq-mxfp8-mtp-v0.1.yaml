# AXQ-MXFP8 8-bit lane for Qwen3.8-Flash-Next (qwen4_exp).
# Trunk attention+MLP+experts -> MXFP8 (group 32). Floors stay affine 8 / BF16.
# Every 8-bit allocation is remapped, so floors must also be group 32.
# Convert with: axquant convert --q-mode mxfp8 --allow-unmeasured ...
# Development evidence only — not a certificate.
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 16.0
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 8
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260828
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms and gated-residual mixers stay BF16
  - rule_id: mtp-bf16
    roles: [mtp_projection, mtp_block, mtp_output]
    bits: 16
    method: bf16
    reason: Integrated MTP extracted as a BF16 sidecar
  - rule_id: lm-head-8
    roles: [lm_head]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-026 lm_head 8-bit affine floor group 32 for MXFP8 remap
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Token + PLE/n-gram floor; PLE shard width 160 requires gs32
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor remains 8-bit
  - rule_id: attention-mxfp8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 attention trunk
  - rule_id: mlp-mxfp8
    roles: [mlp, expert]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 MLP + fused expert trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
