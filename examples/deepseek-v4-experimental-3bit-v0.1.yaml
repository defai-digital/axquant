# Experimental 3-bit DeepSeek V4 Flash recipe (AXQ-028).
# Development evidence only — not a production claim without the release audit.
# AX Engine requires AX_ENGINE_3BIT_EXPERIMENTAL=1 at runtime.
schema_version: axquant.manual-recipe.v1
profile: general
target_bpw: 16.0
default_bits: 3
default_method: affine
group_size: 32
allow_unmatched_rules: true
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 0
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16 under protection floors
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM head stays BF16 by default
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor remains 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor remains 8-bit when routers are present
  - rule_id: protect-attention
    roles: [attention]
    bits: 4
    method: affine
    group_size: 32
    reason: Attention trunk stays at least 4-bit for experimental low-bit packs
  - rule_id: trunk-experimental-3bit
    roles: [mlp, expert]
    bits: 3
    method: affine
    group_size: 32
    reason: Experimental 3-bit robust trunk (MLP + fused experts)
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
