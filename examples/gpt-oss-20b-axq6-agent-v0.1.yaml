# GPT-OSS 20B AXQ 6-bit — optional manual recipe for openai native source.
# architecture_prior at 6.0 BPW already certified from community MXFP4-Q4;
# this recipe is a conservative native-source rebuild with attention 8-bit.
# Use when prior 6.0 fails quality vs OpenAI native reference.
schema_version: axquant.manual-recipe.v1
profile: agent-coding
# Raised for openai native BF16 non-experts + attention 8-bit (measured ~6.88).
# Prefer architecture_prior --target-bpw 6.0 when a stricter 6.0 product window is required.
target_bpw: 6.9
default_bits: 6
default_method: affine
group_size: 64
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: balanced
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor — LM head stays BF16
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 64
    reason: Router floor 8-bit for routing stability
  - rule_id: attention-8bit
    roles: [attention]
    bits: 8
    method: affine
    group_size: 64
    reason: Raise attention for coding/general fidelity from native BF16
  - rule_id: experts-6bit
    roles: [expert, mlp]
    bits: 6
    method: affine
    group_size: 64
    reason: MoE experts/MLP at 6-bit product trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
