# AXQ-MXFP8 8-bit lane for Cyber-Tiel-Coder-35B-A3B with external MTP sidecar.
# Trunk attention+experts -> MXFP8 (group 32). Embedding/routers 8-bit affine
# floors at group 32 for the MXFP8 remap, LM head/norms/vision/MTP BF16.
# Every 8-bit allocation is remapped, so floors must also be group 32.
# Convert from the pinned oQ6e repack source (no BF16 reference exists).
#   axquant convert --q-mode mxfp8 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 9.4
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms non-quantizable / protected
  - rule_id: mtp-bf16
    roles: [mtp_projection, mtp_block, mtp_output]
    bits: 16
    method: bf16
    reason: External MTP sidecar preserved byte-for-byte
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor - LM head stays BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor 8-bit affine group 32 for MXFP8 remap
  - rule_id: routers-8
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor 8-bit affine group 32 for MXFP8 remap
  - rule_id: attention-mxfp8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 attention trunk
  - rule_id: experts-mxfp8
    roles: [expert]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 expert trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
