# Development candidate: AXQ-MXFP4 Qwen3.8-Flash-Next with 8-bit affine language attention.
# Experts and MLP use native MXFP4 (group 32); attention and QSA indexer stay 8-bit affine.
# Convert with: axquant convert --q-mode mxfp4 --allow-unmeasured ... Unmeasured; not a certificate.
# Development evidence only — not a certificate.
schema_version: axquant.manual-recipe.v2
profile: agent-coding
# Planner uses affine storage_bpw for gs32 4-bit; PLE 8-bit floor lands near 6.25.
target_bpw: 6.8
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 8
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260828
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms and gated-residual mixers stay BF16
  - rule_id: mtp-bf16
    roles: [mtp_projection, mtp_block, mtp_output]
    bits: 16
    method: bf16
    reason: Integrated MTP extracted as a BF16 sidecar
  - rule_id: lm-head-8
    roles: [lm_head]
    bits: 8
    method: affine
    group_size: 64
    reason: AXQ-026 lm_head 8-bit affine floor
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Token + PLE/n-gram floor; PLE shard width 160 requires gs32
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor remains 8-bit
  - rule_id: attention-8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 64
    reason: Candidate - language attention and QSA indexer projections at 8-bit affine
  - rule_id: mlp-mxfp4
    roles: [mlp, expert]
    bits: 4
    method: affine
    group_size: 32
    reason: AXQ-MXFP4 MLP + fused expert trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
