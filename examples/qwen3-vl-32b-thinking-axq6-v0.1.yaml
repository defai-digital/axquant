# Qwen3-VL-32B-Thinking AXQ 6-bit (no MTP).
# Language attention+MLP 6-bit affine. Vision stays BF16.
schema_version: axquant.manual-recipe.v1
profile: agent-coding
target_bpw: 8.0
default_bits: 6
default_method: affine
group_size: 64
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: balanced
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor — LM head stays BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: attention-6
    roles: [attention]
    bits: 6
    method: affine
    group_size: 64
    reason: Language attention 6-bit trunk
  - rule_id: mlp-6
    roles: [mlp]
    bits: 6
    method: affine
    group_size: 64
    reason: Language MLP 6-bit trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
