# Qwen3.5-0.8B-decision AXQ-MXFP4.
# Merge the published rank-16 LoRA into BF16 before planning.
# Language attention and MLP use native MXFP4 (group 32).
# Vision, MTP, and norms stay BF16. Embeddings stay 8-bit affine.
# The joint schema head is copied after convert. There is no separate lm_head.
# Convert with: axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 8.0
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261011
hardware:
  name: ax-engine-apple-silicon-mxfp4
  runtime: ax-engine
  supported_bits:
    - 4
    - 8
    - 16
  supported_methods:
    - affine
    - mxfp4
    - bf16
  supported_group_sizes:
    - 32
    - 64
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 language attention trunk
  - rule_id: mlp-mxfp4
    roles: [mlp]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 language MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
