# Hy-MT2-30B-A3B AXQ-MXFP4. Attention, MLP, shared MLP, and experts are MXFP4.
# Norms stay BF16. Embeddings, the LM head, and router gates are 8-bit affine.
# expert_bias is a 1-D router vector and stays BF16. No MTP tensors.
# Convert with: axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 8.0
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 8
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261011
hardware:
  name: ax-engine-apple-silicon-mxfp4
  runtime: ax-engine
  supported_bits:
    - 4
    - 8
    - 16
  supported_methods:
    - affine
    - mxfp4
    - bf16
  supported_group_sizes:
    - 32
    - 64
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: lm-head-8
    roles: [lm_head]
    bits: 8
    method: affine
    group_size: 32
    reason: LM head 8-bit affine floor
  - rule_id: router-8
    roles: [router]
    bits: 8
    method: affine
    group_size: 64
    reason: Router gate 8-bit affine; 1-D expert_bias stays BF16
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 attention
  - rule_id: mlp-mxfp4
    roles: [mlp]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 dense MLP and shared MLP
  - rule_id: expert-mxfp4
    roles: [expert]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 routed experts
