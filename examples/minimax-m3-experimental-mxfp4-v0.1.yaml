# Experimental MXFP4 Super-class recipe for MiniMax-M3 (BF16 source).
# Hobby / curiosity pack only. Will not be certified. Stream required.
# Run after the 2-bit SKU has Hub-published and Ext12T is cleaned.
schema_version: axquant.manual-recipe.v1
profile: general
target_bpw: 16.0
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: true
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 0
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower stays BF16 (AXQ-006)
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16 under protection floors
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM head stays BF16 by default
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor remains 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor remains 8-bit
  - rule_id: trunk-mxfp4
    roles: [mlp, attention, expert]
    bits: 4
    method: affine
    group_size: 32
    reason: MXFP4 product class; convert with --q-mode mxfp4
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
