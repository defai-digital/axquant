# Experimental 2-bit + fine group recipe (QP3 / AXQ-028).
# Development evidence only — not a production claim without the release audit.
# AX Engine requires AX_ENGINE_2BIT_EXPERIMENTAL=1 at runtime.
schema_version: axquant.manual-recipe.v1
profile: general
target_bpw: 3.5
default_bits: 2
default_method: affine
group_size: 32
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 0
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16 under protection floors
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM head stays BF16 by default
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor remains 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor remains 8-bit
  - rule_id: trunk-experimental-2bit
    roles: [mlp, attention, expert]
    bits: 2
    method: affine
    group_size: 32
    reason: Experimental 2-bit trunk with fine groups (development evidence only)
