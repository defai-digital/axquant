# GPT-OSS 120B AXQ 6-bit — agent-coding-biased manual recipe (v0.1).
# Goal: clear checkpoint Tier 1 agent-coding retention (≥0.98) vs MXFP4-Q4.
# Backup recipe if agent-coding prior is insufficient: no 4-bit trunk + attention 8.
# Planned BPW is ~6.58 (outside the 6.0±0.35 product-class window); still ship as
# AXQ-6bit product name when quality is the goal. Use after agent-coding prior fails.
schema_version: axquant.manual-recipe.v1
profile: agent-coding
target_bpw: 6.6
default_bits: 6
default_method: affine
group_size: 64
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: balanced
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor — LM head stays BF16
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 64
    reason: Router floor 8-bit for routing stability
  - rule_id: attention-8bit
    roles: [attention]
    bits: 8
    method: affine
    group_size: 64
    reason: Raise attention for coding fidelity
  - rule_id: experts-6bit
    roles: [expert, mlp]
    bits: 6
    method: affine
    group_size: 64
    reason: MoE experts/MLP at 6-bit only (no 4-bit trunk)
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
