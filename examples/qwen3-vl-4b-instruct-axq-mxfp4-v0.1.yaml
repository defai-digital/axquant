# Qwen3-VL-4B-Instruct AXQ-MXFP4 (no MTP).
# Language attention+MLP native MXFP4 (group 32). Vision stays BF16.
# Convert with: axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 8.0
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260728
hardware:
  name: ax-engine-apple-silicon-mxfp4
  runtime: ax-engine
  supported_bits:
    - 4
    - 8
    - 16
  supported_methods:
    - affine
    - mxfp4
    - bf16
  supported_group_sizes:
    - 32
    - 64
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  # No protect-lm-head rule: the 4B source ships no lm_head tensor (tied
  # embeddings reuse embed_tokens, which stays 8-bit protected below).
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 language attention trunk
  - rule_id: mlp-mxfp4
    roles: [mlp]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 language MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
