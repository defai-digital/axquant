# Qwen3-Coder-Next AXQ-MXFP4 (no MTP).
# Attention + fused experts/MLP → native MXFP4 (group 32). Floors stay affine 8 / BF16.
# Convert with: axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v1
profile: agent-coding
# Planner still uses affine storage_bpw (4 + 32/32 = 5.0) for gs32 4-bit;
# real MXFP4 is ~4.25. 5.6 leaves room for 8-bit embed/router and BF16 lm_head.
target_bpw: 5.6
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor — LM head stays BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: routers-8
    roles: [router]
    bits: 8
    method: affine
    group_size: 64
    reason: Router floor 8-bit for routing stability
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: affine
    group_size: 32
    reason: AXQ-MXFP4 attention trunk (full + linear)
  - rule_id: experts-mxfp4
    roles: [expert, mlp]
    bits: 4
    method: affine
    group_size: 32
    reason: AXQ-MXFP4 fused expert/MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
