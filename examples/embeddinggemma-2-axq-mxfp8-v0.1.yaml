# EmbeddingGemma 2 AXQ-MXFP8 (no MTP).
# Language attention and MLP are MXFP8 (group 32) via --q-mode mxfp8 remap.
# Embeddings use the same group so the 8-bit floor remaps cleanly.
# Vision, audio, modality projections, the embedding projection, and norms
# stay BF16. Do not cast activations to float16.
# Convert with: axquant convert --q-mode mxfp8 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 16.0
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261011
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower and modality projections stay BF16
  - rule_id: protect-audio
    roles: [audio]
    bits: 16
    method: bf16
    reason: Audio tower stays BF16
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Final 512 to 768 embedding projection stays BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor 8-bit affine group 32 for MXFP8 remap
  - rule_id: attention-mxfp8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 language attention trunk
  - rule_id: mlp-mxfp8
    roles: [mlp]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 language MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
