# Quality-first Flash-0731 pack: 4-bit DWQ clip on fused trunk, group 128.
# Attention 6-bit DWQ (instruction path). Not mlx-optiq. Not another 2-bit mix.
#
# Affine 2/3/4 only moved mean 0.310 -> 0.339. Next spend is convert-time
# percentile clip on the same stacks, after official DSV4 chat encoding.
schema_version: axquant.manual-recipe.v1
profile: general
target_bpw: 16.0
default_bits: 4
default_method: dwq
group_size: 128
allow_unmatched_rules: true
lm_head_min_bits: 16
target_mode: quality
primary_runtime: ax-engine
random_seed: 0
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16 under protection floors
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM head stays BF16 by default
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 128
    reason: Embedding floor remains 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 128
    reason: Router floor remains 8-bit when routers are present
  - rule_id: attention-6bit-dwq
    roles: [attention]
    bits: 6
    method: dwq
    group_size: 128
    reason: Instruction path stays above 4-bit after DWQ clip
  - rule_id: trunk-4bit-dwq
    roles: [mlp, expert]
    bits: 4
    method: dwq
    group_size: 128
    reason: Fused trunk is 4-bit DWQ clip then affine pack
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
