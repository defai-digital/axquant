# GPT-OSS 120B AXQ 4-bit — agent-coding recovery recipe (v0.1).
# Use with openai/gpt-oss-120b (native MXFP4 experts + BF16 non-experts).
# Prefer this over re-packing mlx-community MXFP4-Q4 (avoids double-quant of attention).
# Prior architecture_prior 4-bit from community Q4 failed agent-coding (0.952 < 0.98).
# Strategy: experts 4-bit trunk; attention 8-bit; protect router/norm/lm_head.
schema_version: axquant.manual-recipe.v1
profile: agent-coding
target_bpw: 5.1
default_bits: 4
default_method: affine
group_size: 64
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: balanced
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor — LM head stays BF16
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 64
    reason: Router floor 8-bit for routing stability
  - rule_id: attention-8bit
    roles: [attention]
    bits: 8
    method: affine
    group_size: 64
    reason: Raise attention for coding fidelity (native BF16 source, not double-quant)
  - rule_id: experts-4bit
    roles: [expert, mlp]
    bits: 4
    method: affine
    group_size: 64
    reason: MoE experts/MLP at 4-bit product trunk (MXFP4 dequant → affine)
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
