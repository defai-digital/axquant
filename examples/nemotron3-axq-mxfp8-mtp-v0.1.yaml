# Development-only standard MLX export; preserve integrated Nemotron MTP at BF16.
schema_version: axquant.manual-recipe.v2
profile: general
target_bpw: 16.0
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261004
rules:
  - rule_id: preserve-nemotron-mtp
    module_glob: "mtp.*"
    bits: 16
    method: bf16
    reason: Preserve every integrated Nemotron MTP tensor at source precision
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms remain at source precision
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Keep output head at source precision
  - rule_id: embedding-floor
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: MXFP8 physical packing requires group size 32
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 16
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: false
