# Clef-Omni AXQ-MXFP8. Same role policy as MXFP4.
# q-mode mxfp8 remaps every 8-bit affine allocation onto group 32.
# Vision, the audio encoder, code2wav, norms, and LM heads stay BF16.
# The joint schema head is copied after convert.
# Convert with: axquant convert --q-mode mxfp8 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 16.0
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261011
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-audio
    roles: [audio]
    bits: 16
    method: bf16
    reason: Audio encoder and code2wav stay BF16
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM heads and the talker codec head stay BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor 8-bit affine group 32 for MXFP8 remap
  - rule_id: router-8
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor 8-bit affine group 32 for MXFP8 remap
  - rule_id: attention-mxfp8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 thinker and talker attention
  - rule_id: mlp-mxfp8
    roles: [mlp]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 thinker and talker MLP
  - rule_id: expert-mxfp8
    roles: [expert]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 thinker and talker experts
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
