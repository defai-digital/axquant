# EmbeddingGemma 2 AXQ-MXFP4 (no MTP).
# Language attention and MLP are native MXFP4 (group 32).
# Token embeddings and per-layer embedder projections are 8-bit affine.
# Vision, audio, modality projections, the 512→768 embedding projection, and
# norms stay BF16. Towers dominate the parameter count, so the recipe budget
# is 16 BPW even though the trunk is MXFP4.
# Do not cast activations to float16. Do not claim generative or MTEB scores.
# Convert with: axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 16.0
default_bits: 4
default_method: affine
group_size: 64
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261011
hardware:
  name: ax-engine-apple-silicon-mxfp4
  runtime: ax-engine
  supported_bits:
    - 4
    - 8
    - 16
  supported_methods:
    - affine
    - mxfp4
    - bf16
  supported_group_sizes:
    - 32
    - 64
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower and modality projections stay BF16
  - rule_id: protect-audio
    roles: [audio]
    bits: 16
    method: bf16
    reason: Audio tower stays BF16
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Final 512 to 768 embedding projection stays BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 language attention trunk
  - rule_id: mlp-mxfp4
    roles: [mlp]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 language MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
