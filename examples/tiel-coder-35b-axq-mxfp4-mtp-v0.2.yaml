# AXQ-MXFP4 4-bit lane for Tiel-Coder-35B-A3B with external MTP sidecar (remark v0.2).
# Trunk attention+experts -> native MXFP4 (group 32). Embedding/routers 8-bit
# affine floors, LM head/norms/vision/MTP BF16.
# v0.2 replaces the retired affine-4 trunk (AXQ-047) with the enforced MXFP4 rung;
# physical output is identical to the v0.1 affine-4 plus --q-mode mxfp4 remap.
# Convert from the pinned oQ6e repack source (no BF16 reference exists).
#   axquant convert --q-mode mxfp4 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 5.61
default_bits: 4
default_method: affine
group_size: 32
allow_unmatched_rules: false
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260728
hardware:
  name: ax-engine-apple-silicon-mxfp4
  runtime: ax-engine
  supported_bits:
    - 4
    - 8
    - 16
  supported_methods:
    - affine
    - mxfp4
    - bf16
  supported_group_sizes:
    - 32
    - 64
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms non-quantizable / protected
  - rule_id: mtp-bf16
    roles: [mtp_projection, mtp_block, mtp_output]
    bits: 16
    method: bf16
    reason: External MTP sidecar preserved byte-for-byte
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: Protection floor - LM head stays BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 64
    reason: Embedding floor 8-bit affine
  - rule_id: routers-8
    roles: [router]
    bits: 8
    method: affine
    group_size: 64
    reason: Router floor 8-bit affine
  - rule_id: attention-mxfp4
    roles: [attention]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 attention trunk
  - rule_id: experts-mxfp4
    roles: [expert]
    bits: 4
    method: mxfp4
    group_size: 32
    reason: AXQ-MXFP4 expert trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
