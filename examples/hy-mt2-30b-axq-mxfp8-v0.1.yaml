# Hy-MT2-30B-A3B AXQ-MXFP8. Attention, MLP, shared MLP, experts, embeddings,
# the LM head, and router gates are 8-bit affine group 32. Norms stay BF16.
# expert_bias is a 1-D router vector and stays BF16. No MTP tensors.
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 16.0
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 8
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261011
hardware:
  name: ax-engine-apple-silicon-mxfp8
  runtime: ax-engine
  supported_bits:
    - 8
    - 16
  supported_methods:
    - affine
    - bf16
  supported_group_sizes:
    - 32
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor 8-bit affine group 32
  - rule_id: lm-head-8
    roles: [lm_head]
    bits: 8
    method: affine
    group_size: 32
    reason: LM head 8-bit affine group 32
  - rule_id: router-8
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router gate 8-bit affine; 1-D expert_bias stays BF16
  - rule_id: attention-8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 attention
  - rule_id: mlp-8
    roles: [mlp]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 dense MLP and shared MLP
  - rule_id: expert-8
    roles: [expert]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 routed experts
