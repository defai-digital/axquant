# Qwen3-VL-4B-Instruct AXQ-MXFP8 (no MTP).
# Language attention+MLP native MXFP8 (group 32). Vision stays BF16.
# Every 8-bit allocation is remapped, so floors must also be group 32.
# Convert with: axquant convert --q-mode mxfp8 --allow-unmeasured ...
schema_version: axquant.manual-recipe.v2
profile: agent-coding
target_bpw: 16.0
default_bits: 8
default_method: affine
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20260728
rules:
  - rule_id: protect-vision
    roles: [vision]
    bits: 16
    method: bf16
    reason: Vision tower BF16-protected
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Protection floor — norms stay BF16
  # No protect-lm-head rule: the 4B source ships no lm_head tensor (tied
  # embeddings reuse embed_tokens, which stays 8-bit protected below).
  - rule_id: embedding-8
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor 8-bit affine group 32 for MXFP8 remap
  - rule_id: attention-mxfp8
    roles: [attention]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 language attention trunk
  - rule_id: mlp-mxfp8
    roles: [mlp]
    bits: 8
    method: affine
    group_size: 32
    reason: AXQ-MXFP8 language MLP trunk
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
