# Experimental Flash-0731 2-bit recipe v0.4 (shared experts 4-bit only).
# Development only. Not a certificate. Not mlx-optiq.
#
# One change vs uniform v0.1: shared experts 2-bit affine -> 4-bit affine.
# Does not reuse mixed-v0.1 (also raised edge FFN and routed w2 to 3-bit),
# attn6-v0.2 (DWQ + shared 4-bit), or attn6-affine-v0.3 (attention 6-bit).
# Routed trunk stays 2-bit affine. AX Engine: AX_ENGINE_2BIT_EXPERIMENTAL=1.
schema_version: axquant.manual-recipe.v1
profile: general
target_bpw: 16.0
default_bits: 2
default_method: affine
group_size: 32
allow_unmatched_rules: true
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 0
rules:
  - rule_id: protect-norms
    roles: [norm]
    bits: 16
    method: bf16
    reason: Norms stay BF16 under protection floors
  - rule_id: protect-lm-head
    roles: [lm_head]
    bits: 16
    method: bf16
    reason: LM head stays BF16 by default
  - rule_id: protect-embeddings
    roles: [embedding]
    bits: 8
    method: affine
    group_size: 32
    reason: Embedding floor remains 8-bit
  - rule_id: protect-routers
    roles: [router]
    bits: 8
    method: affine
    group_size: 32
    reason: Router floor remains 8-bit when routers are present
  - rule_id: protect-attention
    roles: [attention]
    bits: 4
    method: affine
    group_size: 32
    reason: Attention trunk stays at least 4-bit for experimental low-bit packs
  - rule_id: shared-experts-4bit
    module_glob: "layers.*.ffn.shared_experts*"
    bits: 4
    method: affine
    group_size: 32
    reason: Shared experts run every token; keep them above 2-bit
  - rule_id: trunk-experimental-2bit
    roles: [mlp, expert]
    bits: 2
    method: affine
    group_size: 32
    reason: Experimental 2-bit robust trunk (routed experts + other MLP)
mtp:
  mode: protected
  candidate_bits: [8, 16]
  min_bits: 8
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: true
