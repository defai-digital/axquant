# Qwen3.5-9B development export from the pinned official BF16 source.
# Vision, MTP, norms, and the output head stay BF16; embeddings use group32.
# Convert with --q-mode mxfp4 --allow-unmeasured.
schema_version: axquant.manual-recipe.v2
profile: general
target_bpw: 8.0
default_bits: 4
default_method: mxfp4
group_size: 32
allow_unmatched_rules: false
lm_head_min_bits: 16
target_mode: low-memory
primary_runtime: ax-engine
random_seed: 20261018
hardware:
  name: apple-silicon-mxfp4-group32
  runtime: ax-engine
  supported_bits:
  - 4
  - 8
  - 16
  supported_methods:
  - affine
  - mxfp4
  - bf16
  supported_group_sizes:
  - 32
rules:
- rule_id: protect-vision
  roles:
  - vision
  bits: 16
  method: bf16
  reason: Vision tower BF16-protected
- rule_id: protect-norms
  roles:
  - norm
  bits: 16
  method: bf16
  reason: Norms non-quantizable / protected
- rule_id: mtp-bf16
  roles:
  - mtp_projection
  - mtp_block
  - mtp_output
  bits: 16
  method: bf16
  reason: Integrated MTP stays BF16; Tier 2 is a separate claim
- rule_id: protect-lm-head
  roles:
  - lm_head
  bits: 16
  method: bf16
  reason: Preserve the source BF16 output head
- rule_id: embedding-8
  roles:
  - embedding
  bits: 8
  method: affine
  group_size: 32
  reason: Protect embeddings with 8-bit affine group32 packing
- rule_id: attention-mxfp4
  roles:
  - attention
  bits: 4
  method: mxfp4
  group_size: 32
  reason: Native MXFP4 attention weights
- rule_id: mlp-mxfp4
  roles:
  - mlp
  bits: 4
  method: mxfp4
  group_size: 32
  reason: Native MXFP4 MLP weights
mtp:
  mode: protected
  candidate_bits:
  - 8
  - 16
  min_bits: 16
  preserve_external_sidecar: true
  protect_norms: true
  protect_output_head: true
  optimize_for_acceptance: false
