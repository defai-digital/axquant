[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "axquant"
version = "1.5.1"
description = "CLI toolkit for converting supported MLX language and multimodal checkpoints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutomatosX" }]
keywords = ["mlx", "quantization", "apple-silicon", "multimodal", "mtp", "ptq"]
classifiers = [
    # Toolkit API and CLI are feature-complete and tested; formal host/candidate Hub
    # certification (MTP speed, size floor, release-audit) remains evidence-gated.
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.24",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0",
    "safetensors>=0.4.5",
    "structlog>=24.2",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.29",
    "mlx-audio>=0.4.7",
    "mlx-lm>=0.31",
    "mlx-vlm>=0.6.10",
]
dev = [
    "mypy>=1.11",
    "numpy>=2.0,<2.4",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
axquant = "axquant.cli:entrypoint"

[project.urls]
# Canonical install is PyPI; GitHub Releases mirror wheels. The repo Packages
# tab is for npm/container/etc. registries — not pip — so it stays empty by design.
Homepage = "https://pypi.org/project/axquant/"
Documentation = "https://github.com/defai-digital/axquant#readme"
Repository = "https://github.com/defai-digital/axquant"
Issues = "https://github.com/defai-digital/axquant/issues"
Changelog = "https://github.com/defai-digital/axquant/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/axquant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: real-hardware end-to-end pipeline tests (Apple Silicon + MLX)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["axquant"]

# Optional execution backends (axquant[mlx]) are not present on the Ubuntu lint
# job. Ignore missing imports so mypy can type-check the non-MLX surface without
# requiring Apple Silicon packages or transformers on that runner.
[[tool.mypy.overrides]]
module = [
    "mlx",
    "mlx.*",
    "mlx_lm",
    "mlx_lm.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["axquant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
