# Portable AWQ/GPTQ grid defaults shared by refinement backends.

awq:
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  supported_bits: [4, 6, 8]
  supported_group_sizes: [32, 64, 128]

gptq:
  max_calibration_rows: 4096
  supported_bits: [2, 3, 4, 6, 8]
  supported_group_sizes: [32, 64, 128]
  default_damping: 0.01
  default_block_size: 128
