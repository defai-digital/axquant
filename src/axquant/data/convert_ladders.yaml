# Named convert ladders: prior -> measured-lite -> measured-full.
# Keys must match ConvertLadderName enum values.
# AXQ-070: every ladder plans over the three MLX storage formats only:
# MXFP4 (4-bit), the MXFP8 slot (unrefined 8-bit) and BF16, all at group 32.
# The refine-awq-dwq ladder is retired (AWQ/GPTQ/DWQ emit affine packing).

order:
  - prior
  - measured-lite
  - measured-full

ladders:
  prior:
    evidence_kind: architecture_prior
    allow_unmeasured: true
    candidate_bits: [4, 8, 16]
    candidate_group_sizes: [32]
    candidate_methods: [affine, mxfp4, bf16]
    requires_calibration: false
    requires_measured_sensitivity: false
    requires_refinement: false
    default_target_bpw: 4.8
    estimated_relative_cost: 0.01
    estimated_ram_multiplier_vs_4bit: 0.0
    description: >-
      Architecture-prior plan over MXFP4, MXFP8 and BF16. Development
      evidence only; release claims require measured sensitivity or a
      measured recipe bundle.
    notes:
      - Always available (no forward probes).
      - Group size 32 only; 4-bit is MXFP4 and 8-bit is MXFP8 (AXQ-070).

  measured-lite:
    evidence_kind: measured_development
    allow_unmeasured: false
    candidate_bits: [4, 8, 16]
    candidate_group_sizes: [32]
    candidate_methods: [affine, mxfp4, bf16]
    requires_calibration: true
    requires_measured_sensitivity: true
    requires_refinement: false
    default_target_bpw: 5.0
    estimated_relative_cost: 0.25
    estimated_ram_multiplier_vs_4bit: 1.0
    description: >-
      Lightweight measured probes over MXFP4, MXFP8 and BF16. Produces
      measured_development evidence suitable for iteration, not certification.
    notes:
      - Prefer when probe capacity is measured-lite or streaming-partial.

  measured-full:
    evidence_kind: measured
    allow_unmeasured: false
    candidate_bits: [4, 8, 16]
    candidate_group_sizes: [32]
    candidate_methods: [affine, mxfp4, bf16]
    requires_calibration: true
    requires_measured_sensitivity: true
    requires_refinement: false
    default_target_bpw: 4.8
    estimated_relative_cost: 1.0
    estimated_ram_multiplier_vs_4bit: 4.0
    description: >-
      Full measured grid over MXFP4, MXFP8 and BF16. Release-quality when the
      probe backend records measured evidence.
    notes:
      - Requires probe capacity bf16-full (or an explicit measured protocol).
