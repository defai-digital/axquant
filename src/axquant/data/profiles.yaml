# Per-architecture-class MTP speed floors (AXQ-045 MH2), keyed by profile and
# then by architecture class. Callers resolve via
# profiles.mtp_speed_floors_for(profile, arch_class); unknown classes fall back
# to the profile's `default` entry and profiles without a table fall back to
# the package constants (1.20 / 1.10). Values intentionally match each
# profile's current thresholds: this table is mechanism-only (ADR AXQ-045);
# numeric changes are deferred pending factory measurements.
mtp_speed_floors:
  general:
    default: {min_effective_speedup: 1.20, min_prompt_median_speedup: 1.10}
    moe: {min_effective_speedup: 1.20, min_prompt_median_speedup: 1.10}
  agent-coding:
    default: {min_effective_speedup: 1.20, min_prompt_median_speedup: 1.10}
    moe: {min_effective_speedup: 1.20, min_prompt_median_speedup: 1.10}
  agent:
    default: {min_effective_speedup: 1.02, min_prompt_median_speedup: 1.10}
    moe: {min_effective_speedup: 1.02, min_prompt_median_speedup: 1.10}

thresholds:
  general:
    min_effective_speedup: 1.20
    min_prompt_median_speedup: 1.10
  agent-coding:
    max_task_score_drop: 0.01
    max_mtp_acceptance_drop: 0.02
    max_mtp_token_accuracy_drop: 0.03
    max_repetition_increase: 0.005
    max_divergence_increase: 0.005
    min_effective_speedup: 1.20
    min_prompt_median_speedup: 1.10
    required_task_scores:
      - coding
      - tool
      - json
      - multilingual
      - long_context
  agent:
    max_task_score_drop: 0.015
    max_mtp_acceptance_drop: 0.02
    max_mtp_token_accuracy_drop: 0.03
    max_repetition_increase: 0.005
    max_divergence_increase: 0.005
    min_effective_speedup: 1.02
  coding:
    max_task_score_drop: 0.01
    max_mtp_acceptance_drop: 0.025
    max_mtp_token_accuracy_drop: 0.035
    max_repetition_increase: 0.005
    max_divergence_increase: 0.005
  translation:
    max_task_score_drop: 0.01
  reasoning:
    max_task_score_drop: 0.01
  long-context:
    max_task_score_drop: 0.015
    max_mtp_acceptance_drop: 0.03
